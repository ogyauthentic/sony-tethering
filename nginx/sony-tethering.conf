# nginx reverse proxy for sony-tethering
# Save this file as /etc/nginx/sites-available/sony-tethering (or copy to nginx/sony-tethering.conf)

# HTTP server: redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.example; # REPLACE with your domain or public IP

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server: proxy to local Node app (http://127.0.0.1:3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your.domain.example; # REPLACE

    # SSL certs (use certbot to obtain letsencrypt certs and set these paths)
    ssl_certificate /etc/letsencrypt/live/your.domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # HSTS (enable after you confirmed HTTPS works)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy settings
    client_max_body_size 200m;      # allow large images/uploads
    proxy_buffering off;            # turn off buffering for live updates

    # Timeouts (keep WebSocket connections alive)
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Logging
    access_log /var/log/nginx/sony-tethering.access.log;
    error_log  /var/log/nginx/sony-tethering.error.log;

    # Root location — forward to Node app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific (ensure long-lived connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # If you want to serve /photos directly from disk (optional) instead of proxying
    # uncomment and update the path to the photos folder
    # location /photos/ {
    #     alias /path/to/repo/photos/; # e.g. /home/username/sony-tethering/photos/
    #     access_log off;
    #     sendfile on;
    #     tcp_nopush on;
    # }
}

# Small helper map and variables (put near http context in /etc/nginx/nginx.conf or keep as-is)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
